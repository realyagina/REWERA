<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background plaster / travertine gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F2EB" />
      <stop offset="50%" stop-color="#EBE6DC" />
      <stop offset="100%" stop-color="#E2DCD1" />
    </linearGradient>

    <!-- Warm radial sunlight vignette -->
    <radialGradient id="sunGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFFDF9" stop-opacity="0.75" />
      <stop offset="60%" stop-color="#E8E2D7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#D0C8B8" stop-opacity="0.6" />
    </radialGradient>

    <!-- Leaf shadow overlay gradient -->
    <linearGradient id="shadowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D2821" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#2D2821" stop-opacity="0.0" />
    </linearGradient>

    <!-- Logo Gradients -->
    <linearGradient id="ogTopRibbon" x1="0%" y1="40%" x2="100%" y2="20%">
      <stop offset="0%" stop-color="#849070" />
      <stop offset="45%" stop-color="#727E5E" />
      <stop offset="85%" stop-color="#556045" />
      <stop offset="100%" stop-color="#424B35" />
    </linearGradient>

    <linearGradient id="ogFoldShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B543A" stop-opacity="0.9" />
      <stop offset="65%" stop-color="#677353" />
      <stop offset="100%" stop-color="#899774" />
    </linearGradient>

    <linearGradient id="ogLeaf" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#7A8765" />
      <stop offset="50%" stop-color="#5A6548" />
      <stop offset="100%" stop-color="#3D4530" />
    </linearGradient>

    <linearGradient id="ogTerracotta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B573D" />
      <stop offset="40%" stop-color="#A97153" />
      <stop offset="75%" stop-color="#BD8465" />
      <stop offset="100%" stop-color="#CC9174" />
    </linearGradient>

    <!-- Foliage Green Gradients -->
    <linearGradient id="foliageGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#434D37" />
      <stop offset="100%" stop-color="#282F22" />
    </linearGradient>
    <linearGradient id="foliageGrad2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3E4733" />
      <stop offset="100%" stop-color="#242B1E" />
    </linearGradient>

    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#2A2621" flood-opacity="0.12" />
    </filter>
  </defs>

  <style>
    .font-serif {
      font-family: 'Cormorant Garamond', Georgia, serif;
    }
    .font-sans {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }
  </style>

  <!-- 1. Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#sunGlow)" />

  <!-- 2. Soft Foliage Cast Shadows (Left and Right) -->
  <g opacity="0.45" filter="blur(16px)">
    <!-- Top-left leaves shadow -->
    <path d="M -80 -60 C 40 40, 140 100, 220 180 C 120 150, 40 90, -80 0 Z" fill="#3D372E" />
    <path d="M -50 80 C 60 140, 180 200, 260 280 C 150 250, 60 180, -50 120 Z" fill="#3D372E" />
    <path d="M -100 240 C 30 280, 160 320, 230 400 C 130 380, 40 330, -100 290 Z" fill="#3D372E" />
    <!-- Top-right leaves shadow -->
    <path d="M 1280 -60 C 1140 60, 1020 140, 920 220 C 1040 170, 1160 90, 1280 20 Z" fill="#3D372E" />
    <path d="M 1260 140 C 1120 220, 1000 290, 900 370 C 1030 330, 1140 240, 1260 180 Z" fill="#3D372E" />
  </g>

  <!-- Foreground Aesthetic Tropical Leaves Framing the Edge -->
  <!-- Left Side Tropical Leaves -->
  <g opacity="0.92">
    <path d="M -70 120 C 20 160, 110 240, 150 360 C 80 340, 0 280, -70 200 Z" fill="url(#foliageGrad1)" />
    <path d="M -100 250 C -10 290, 80 370, 110 490 C 40 470, -30 410, -100 330 Z" fill="url(#foliageGrad2)" />
    <path d="M -50 -20 C 40 20, 130 100, 170 210 C 90 190, 10 130, -50 50 Z" fill="url(#foliageGrad1)" />
    <!-- Center Leaf Veins -->
    <path d="M -70 120 Q 50 250 150 360" stroke="#7A8765" stroke-width="1.8" fill="none" opacity="0.35" />
    <path d="M -100 250 Q 10 380 110 490" stroke="#7A8765" stroke-width="1.8" fill="none" opacity="0.35" />
  </g>

  <!-- Bottom-Right Warm Organic Fabric Draped Accent -->
  <g opacity="0.75">
    <path d="M 1240 400 C 1150 430, 1040 500, 980 630 L 1240 630 Z" fill="#D2B99E" opacity="0.5" />
    <path d="M 1260 380 C 1160 410, 1060 480, 1000 630 L 1260 630 Z" fill="#BFA386" opacity="0.3" />
    <!-- Bottom Right Tropical Leaf -->
    <path d="M 1260 460 C 1170 490, 1090 560, 1040 650 C 1110 650, 1200 590, 1260 520 Z" fill="url(#foliageGrad2)" opacity="0.9" />
  </g>

  <!-- 3. CENTER BRAND EMBLEM & TYPOGRAPHY -->
  <g transform="translate(600, 185)" filter="url(#logoShadow)">
    <!-- Scale and Center the 'R' Logo (512x512 origin, centered at 0, -40) -->
    <g transform="translate(-115, -135) scale(0.48)">
      <!-- Top Ribbon Sweep -->
      <path
        d="M 160 135 C 220 130, 275 142, 305 180 C 328 208, 325 240, 298 270 C 285 284, 268 290, 250 286 C 280 270, 292 242, 280 215 C 265 180, 215 160, 175 158 C 165 158, 155 145, 160 135 Z"
        fill="url(#ogTopRibbon)"
      />
      <!-- Ribbon Fold Shadow -->
      <path
        d="M 285 165 C 310 195, 318 228, 298 262 C 288 278, 272 287, 252 287 C 275 272, 288 250, 285 228 C 282 205, 270 185, 250 172 C 265 166, 275 165, 285 165 Z"
        fill="url(#ogFoldShadow)"
        opacity="0.9"
      />
      <!-- Left Leaf Element -->
      <path
        d="M 246 242 C 230 220, 195 185, 165 180 C 160 195, 165 240, 200 275 C 220 295, 240 325, 238 350 C 236 360, 228 368, 215 372 C 205 375, 210 380, 222 376 C 245 368, 256 345, 252 320 C 248 295, 226 270, 210 252 C 185 225, 185 198, 195 190 C 215 205, 240 230, 246 242 Z"
        fill="url(#ogLeaf)"
      />
      <!-- Leaf Spine Highlight -->
      <path
        d="M 172 188 C 192 215, 220 255, 235 315 C 238 330, 235 348, 228 362"
        fill="none"
        stroke="#FAF8F5"
        stroke-width="2.5"
        stroke-linecap="round"
        opacity="0.35"
      />
      <!-- Terracotta Leg -->
      <path
        d="M 252 270 C 260 266, 270 270, 276 280 C 290 305, 315 345, 360 365 C 382 374, 405 376, 425 368 C 400 382, 368 382, 342 368 C 305 348, 280 305, 268 285 C 262 276, 256 272, 252 270 Z"
        fill="url(#ogTerracotta)"
      />
    </g>
  </g>

  <!-- 4. BRAND TYPOGRAPHY -->
  <!-- "R E W E R A" Title -->
  <text
    x="600"
    y="350"
    text-anchor="middle"
    class="font-serif"
    font-size="68"
    font-weight="400"
    letter-spacing="18"
    fill="#25291F"
  >
    REWERA
  </text>

  <!-- "W E A R   A   B E T T E R   T O M O R R O W" -->
  <text
    x="600"
    y="386"
    text-anchor="middle"
    class="font-sans"
    font-size="13"
    font-weight="600"
    letter-spacing="8"
    fill="#525846"
  >
    WEAR A BETTER TOMORROW
  </text>

  <!-- Small Divider Bar -->
  <line x1="560" y1="404" x2="640" y2="404" stroke="#8E997B" stroke-width="1.2" stroke-linecap="round" />

  <!-- Subtitle: "Sustainable Fashion for a Brighter Future" -->
  <text
    x="600"
    y="435"
    text-anchor="middle"
    class="font-serif"
    font-style="italic"
    font-size="23"
    font-weight="400"
    fill="#424738"
  >
    Sustainable Fashion for a Brighter Future
  </text>

  <!-- 5. FOUR FEATURE PILLARS AT THE BOTTOM -->
  <g transform="translate(240, 480)">
    <!-- Column 1: Eco-Friendly Materials -->
    <g transform="translate(50, 0)">
      <!-- Leaf Icon -->
      <path
        d="M 40 10 C 26 10, 18 20, 18 34 C 32 34, 42 26, 42 12 Z M 18 34 L 14 38"
        fill="none"
        stroke="#454A3B"
        stroke-width="1.6"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <path d="M 23 29 L 34 18" stroke="#454A3B" stroke-width="1.4" stroke-linecap="round" />
      <text x="30" y="55" text-anchor="middle" class="font-sans" font-size="10" font-weight="600" letter-spacing="1.8" fill="#3E4435">
        ECO-FRIENDLY
      </text>
      <text x="30" y="68" text-anchor="middle" class="font-sans" font-size="10" font-weight="600" letter-spacing="1.8" fill="#3E4435">
        MATERIALS
      </text>
    </g>

    <!-- Divider 1 -->
    <line x1="150" y1="20" x2="150" y2="65" stroke="#BFB8AA" stroke-width="1" />

    <!-- Column 2: Recycled Resources -->
    <g transform="translate(200, 0)">
      <!-- Recycle Icon -->
      <path
        d="M 30 12 L 36 22 L 24 22 Z M 20 28 L 26 38 L 14 38 Z M 40 28 L 46 38 L 34 38 Z"
        fill="none"
        stroke="#454A3B"
        stroke-width="1.5"
        stroke-linejoin="round"
      />
      <text x="30" y="55" text-anchor="middle" class="font-sans" font-size="10" font-weight="600" letter-spacing="1.8" fill="#3E4435">
        RECYCLED
      </text>
      <text x="30" y="68" text-anchor="middle" class="font-sans" font-size="10" font-weight="600" letter-spacing="1.8" fill="#3E4435">
        RESOURCES
      </text>
    </g>

    <!-- Divider 2 -->
    <line x1="310" y1="20" x2="310" y2="65" stroke="#BFB8AA" stroke-width="1" />

    <!-- Column 3: Timeless Designs -->
    <g transform="translate(360, 0)">
      <!-- T-Shirt Icon -->
      <path
        d="M 23 15 L 26 19 C 28 20, 32 20, 34 19 L 37 15 L 47 19 L 43 27 L 39 25 L 39 39 L 21 39 L 21 25 L 17 27 L 13 19 Z"
        fill="none"
        stroke="#454A3B"
        stroke-width="1.6"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <text x="30" y="55" text-anchor="middle" class="font-sans" font-size="10" font-weight="600" letter-spacing="1.8" fill="#3E4435">
        TIMELESS
      </text>
      <text x="30" y="68" text-anchor="middle" class="font-sans" font-size="10" font-weight="600" letter-spacing="1.8" fill="#3E4435">
        DESIGNS
      </text>
    </g>

    <!-- Divider 3 -->
    <line x1="470" y1="20" x2="470" y2="65" stroke="#BFB8AA" stroke-width="1" />

    <!-- Column 4: A Greener Planet -->
    <g transform="translate(520, 0)">
      <!-- Globe Icon -->
      <circle cx="30" cy="25" r="14" fill="none" stroke="#454A3B" stroke-width="1.6" />
      <path d="M 16 25 Q 30 20 44 25 M 30 11 Q 25 25 30 39" fill="none" stroke="#454A3B" stroke-width="1.3" />
      <text x="30" y="55" text-anchor="middle" class="font-sans" font-size="10" font-weight="600" letter-spacing="1.8" fill="#3E4435">
        A GREENER
      </text>
      <text x="30" y="68" text-anchor="middle" class="font-sans" font-size="10" font-weight="600" letter-spacing="1.8" fill="#3E4435">
        PLANET
      </text>
    </g>
  </g>
</svg>
